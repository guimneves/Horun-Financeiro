# Produção: Horun · Financeiro plugado no Horun Core (passo a passo em
# docs/DEPLOY.md). Antes do primeiro `docker compose up -d --build`:
#   - a rede compartilhada já existe (criada uma vez pelo Core):
#       docker network create horun-network
#   - `.env` preenchido a partir do `.env.example` (nunca versionado).
#
# Portas: NENHUMA da API é publicada — o Core alcança "financeiro-backend" e
# "financeiro-frontend" pela horun-network. A única porta no host é a 8002, a
# porta estreita do Horun Agent (frontend/nginx.conf), que só repassa as 3
# rotas do próprio agente (Prompt_Horun_Modulo.md, seção 10).

# Nome fixo do projeto: sem ele, o Docker usa o NOME DA PASTA para nomear os
# volumes (banco, documentos) — renomear a pasta faria o módulo abrir vazio.
name: horun-financeiro

services:
  financeiro-db:
    image: postgres:16-alpine
    container_name: financeiro-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Volume nomeado: sobrevive a `docker compose down`/rebuild. Só some com
      # `docker compose down -v`, explícito.
      - financeiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem "ports:" — só os containers desta rede falam com o banco.

  db-backup:
    # Dump ao subir e a cada BACKUP_INTERVAL_HOURS, verificado, com rotação de
    # BACKUP_KEEP_DAYS dias, numa pasta do Windows FORA do volume do Docker
    # (Prompt_Horun_Core.md, seção 9.4). Mesmo script do Core e do RE7S.
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      financeiro-db:
        condition: service_healthy
    environment:
      PGHOST: financeiro-db
      PGUSER: financeiro
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: financeiro
      BACKUP_PREFIX: financeiro
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./deploy/backup/pg_backup.sh:/pg_backup.sh:ro
    entrypoint: ["/bin/sh", "/pg_backup.sh"]

  financeiro-backend:
    build: ./backend
    container_name: financeiro-backend
    restart: unless-stopped
    depends_on:
      financeiro-db:
        condition: service_healthy
    environment:
      HORUN_DEV_MODE: "false"
      MODULE_DATABASE_URL: postgresql+psycopg://financeiro:${POSTGRES_PASSWORD}@financeiro-db:5432/financeiro
      MODULE_SECRET_KEY: ${MODULE_SECRET_KEY}
      MODULE_COORDENADOR_PASSWORD: ${MODULE_COORDENADOR_PASSWORD:-}
      MODULE_UPLOAD_ROOT: /data/uploads
      MODULE_MAX_UPLOAD_MB: ${MODULE_MAX_UPLOAD_MB:-50}
      # Drive: no servidor, o OneDrive NÃO está nesta máquina — quem lê é o
      # Horun Agent instalado no PC onde ele sincroniza (docs/AGENT_CONTRACT.md).
      # MODULE_DRIVE_AGENT_ROOT é o nome da pasta liberada no config.json dele.
      MODULE_DRIVE_MODE: ${MODULE_DRIVE_MODE:-agent}
      MODULE_DRIVE_AGENT_ROOT: ${MODULE_DRIVE_AGENT_ROOT:-financeiro}
      MODULE_DRIVE_ROOT: ${MODULE_DRIVE_ROOT:-}
      MODULE_AGENT_TASK_TIMEOUT: ${MODULE_AGENT_TASK_TIMEOUT:-30}
      # Gravar no drive (anexos na pasta do processo) — exige a pasta em
      # "read-write" no config.json do agente. Sincronização automática a
      # cada N minutos (0 = desligada).
      MODULE_DRIVE_WRITE: ${MODULE_DRIVE_WRITE:-false}
      MODULE_DRIVE_AUTO_SYNC_MINUTES: ${MODULE_DRIVE_AUTO_SYNC_MINUTES:-30}
      # Avisos pelo Horun Core (sininho/e-mail) — vazios = sem avisos.
      HORUN_CORE_URL: ${HORUN_CORE_URL:-}
      HORUN_NOTIFY_TOKEN: ${HORUN_NOTIFY_TOKEN:-}
    volumes:
      # Documentos enviados pela tela (cotações, notas...) — volume nomeado,
      # mesma disciplina do banco.
      - financeiro_uploads:/data/uploads
    networks:
      - default
      - horun-network

  financeiro-frontend:
    build:
      context: ./frontend
      args:
        # Sub-caminho sob o qual o Core serve o módulo.
        VITE_BASE: /m/financeiro/
    container_name: financeiro-frontend
    restart: unless-stopped
    depends_on:
      - financeiro-backend
    networks:
      - default
      - horun-network
    ports:
      # Só a porta estreita do Horun Agent — nunca a 80 (ver nginx.conf).
      - "8002:8002"

networks:
  horun-network:
    external: true

volumes:
  financeiro_pgdata:
  financeiro_uploads:

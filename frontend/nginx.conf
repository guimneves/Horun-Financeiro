server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja um arquivo real cai no index.html,
    # deixando o router do frontend decidir a página no cliente. A API não
    # passa por aqui: o Core manda /m/financeiro/api/... direto para o
    # financeiro-backend (internal_base_url).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Porta estreita do Horun Agent (o programa no PC onde o OneDrive sincroniza),
# publicada no host pelo docker-compose.yml. Só as 3 rotas que o próprio
# agente chama, autenticadas pelo token do dispositivo — as de administração
# (/agent/enroll-codes, /agent/devices) e todo o resto caem no 404. Expor mais
# que isso deixaria qualquer PC da rede forjar o cabeçalho de identidade que o
# backend aceita do Core (Prompt_Horun_Modulo.md, seção 10). No backend, a API
# vive sob /api, então /agent/... vira /api/agent/...
server {
    listen 8002;

    # Planilhas e PDFs voltam do agente em base64 (em pedaços de 4 MB): o
    # padrão do nginx (1m) daria 413 e a tarefa nunca terminaria (bug real do RE7S).
    client_max_body_size 50m;

    location = /agent/enroll {
        proxy_pass http://financeiro-backend:8000/api/agent/enroll;
    }
    location = /agent/tasks {
        proxy_pass http://financeiro-backend:8000/api/agent/tasks;
    }
    location ~ ^/agent/tasks/[^/]+/result$ {
        # rewrite em vez de variável no proxy_pass (variável exigiria `resolver`)
        rewrite ^/agent/(.*)$ /api/agent/$1 break;
        proxy_pass http://financeiro-backend:8000;
    }
    location / {
        return 404;
    }
}

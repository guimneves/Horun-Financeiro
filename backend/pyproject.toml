[project]
name = "financeiro"
version = "0.1.0"
description = "Horun · Financeiro — módulo do Projeto Horun"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pypdf==6.1.1",
]
# Leitura da planilha de acompanhamento de saldo na sincronização com o drive
# e do nº do processo na autorização de fornecimento (PDF).
import = [
    "openpyxl>=3.1",
    "pypdf==6.1.1",
]
# Fase 2: driver do PostgreSQL — só necessário na imagem Docker do
# servidor, não no desenvolvimento local (SQLite embutido no Python).
postgres = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]

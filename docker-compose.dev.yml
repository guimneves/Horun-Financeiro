# Compose de DESENVOLVIMENTO standalone (sem o Horun Core), modo DEV, só em
# 127.0.0.1 — uso:  docker compose -f docker-compose.dev.yml up --build
# O de produção, plugado no Core, é o docker-compose.yml (docs/DEPLOY.md).

services:
  backend:
    build: ./backend
    environment:
      # DEV_MODE = todo pedido é o usuário "admin" fixo, sem login. Por isso
      # as portas abaixo só escutam na própria máquina (127.0.0.1): publicar
      # em 0.0.0.0 entregaria a API inteira, como admin, a qualquer PC da
      # rede do laboratório.
      HORUN_DEV_MODE: "true"
      # Avisos pelo Horun Core (opcional; vazio = sem avisos) — ver .env.example
      HORUN_CORE_URL: ${HORUN_CORE_URL:-}
      HORUN_NOTIFY_TOKEN: ${HORUN_NOTIFY_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        # "/" serve standalone; quando plugado no Core, sobrescrever com
        # "/m/financeiro/" (ver Prompt_Horun_Modulo.md, seção 6).
        VITE_BASE: /
    ports:
      - "127.0.0.1:8080:80"
